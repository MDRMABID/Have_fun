<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🤣 Funny Stories - Laugh Zone</title>

    <!-- Playful Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           CSS VARIABLES & THEME SETUP
           ========================================================================== */
        :root {
            --bg-gradient: linear-gradient(135deg, #FFF6B7 0%, #FEE140 25%, #FA709A 75%, #FEE140 100%);
            --primary-yellow: #FFD200;
            --primary-orange: #FF5E36;
            --bubble-pink: #FF3366;
            --electric-purple: #8A2387;
            --neon-green: #00E676;
            --card-bg: #FFFFFF;
            --text-dark: #1F1B24;
            --text-muted: #5A5364;
            --border-color: #1F1B24;
            
            --font-display: 'Fredoka', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            --font-body: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
            
            --neo-shadow: 6px 6px 0px var(--border-color);
            --neo-shadow-hover: 10px 10px 0px var(--border-color);
            --neo-shadow-active: 2px 2px 0px var(--border-color);
            --radius-large: 28px;
            --radius-small: 16px;

            /* Funny Custom Cursors */
            --cursor-default: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><text y='28' font-size='28'>🍌</text></svg>") 4 4, auto;
            --cursor-pointer: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 36 36'><text y='28' font-size='30'>🤣</text></svg>") 16 16, pointer;
        }

        /* ==========================================================================
           GLOBAL STYLES
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: var(--cursor-default);
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            background-size: 300% 300%;
            animation: gradientShift 15s ease infinite;
            font-family: var(--font-body);
            color: var(--text-dark);
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        a, button, select, .clickable {
            cursor: var(--cursor-pointer) !important;
        }

        /* RTL Support */
        [dir="rtl"] {
            direction: rtl;
            font-family: 'Fredoka', Tahoma, sans-serif;
        }

        /* ==========================================================================
           TOP BAR
           ========================================================================== */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.4);
            border-bottom: 3px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .brand-pill {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            background: #FFF;
            padding: 6px 16px;
            border-radius: 999px;
            border: 3px solid var(--border-color);
            box-shadow: 3px 3px 0 var(--border-color);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .brand-pill:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--border-color);
            transition: all 0.15s ease;
        }

        .lang-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-label {
            font-weight: 700;
            font-size: 0.95rem;
            display: none;
        }

        @media (min-width: 600px) {
            .lang-label { display: inline-block; }
        }

        .lang-dropdown {
            appearance: none;
            -webkit-appearance: none;
            background: #FFF url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='%231F1B24' viewBox='0 0 16 16'><path d='M8 11.5l-5-5h10l-5 5z'/></svg>") no-repeat right 14px center;
            padding: 8px 36px 8px 16px;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            border: 3px solid var(--border-color);
            border-radius: 999px;
            box-shadow: var(--neo-shadow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            color: var(--text-dark);
            outline: none;
        }

        .lang-dropdown:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--neo-shadow-hover);
        }

        .lang-dropdown:active {
            transform: translate(2px, 2px);
            box-shadow: var(--neo-shadow-active);
        }

        /* ==========================================================================
           PAGE HEADER
           ========================================================================== */
        .page-header {
            text-align: center;
            padding: 40px 20px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .page-header .emoji-burst {
            font-size: 4rem;
            display: block;
            animation: wobble 2s ease-in-out infinite;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(-3deg) scale(1); }
            50% { transform: rotate(3deg) scale(1.1); }
        }

        .page-header h1 {
            font-family: var(--font-display);
            font-size: clamp(2.8rem, 7vw, 4.5rem);
            font-weight: 700;
            color: var(--text-dark);
            text-shadow: 4px 4px 0px #FFF, 8px 8px 0px var(--bubble-pink);
            margin: 10px 0;
        }

        .page-header .subtitle {
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: 600;
            color: #2F2A38;
            background: rgba(255, 255, 255, 0.7);
            padding: 12px 24px;
            border-radius: var(--radius-small);
            border: 2px dashed var(--border-color);
            display: inline-block;
        }

        /* ==========================================================================
           STORIES GRID
           ========================================================================== */
        .stories-container {
            max-width: 1200px;
            margin: 20px auto 60px;
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
            width: 100%;
        }

        .story-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            border: 4px solid var(--border-color);
            border-radius: var(--radius-large);
            box-shadow: var(--neo-shadow);
            padding: 28px 24px 24px;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .story-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: var(--neo-shadow-hover);
        }

        .story-card:active {
            transform: translateY(2px);
            box-shadow: var(--neo-shadow-active);
        }

        .story-card .story-number {
            position: absolute;
            top: 12px;
            right: 16px;
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 700;
            color: rgba(0, 0, 0, 0.08);
            line-height: 1;
            pointer-events: none;
        }

        .story-card .story-emoji {
            font-size: 2.8rem;
            margin-bottom: 8px;
        }

        .story-card .story-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .story-card .story-content {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-muted);
            flex-grow: 1;
            margin-bottom: 14px;
        }

        .story-card .story-tag {
            display: inline-block;
            background: var(--primary-yellow);
            padding: 4px 14px;
            border-radius: 999px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.8rem;
            border: 2px solid var(--border-color);
            align-self: flex-start;
            margin-top: 4px;
        }

        /* Different colored tags */
        .story-card:nth-child(3n+1) .story-tag { background: #FFE066; }
        .story-card:nth-child(3n+2) .story-tag { background: #74C0FC; }
        .story-card:nth-child(3n+3) .story-tag { background: #FF85A2; }

        /* ==========================================================================
           BACK BUTTON
           ========================================================================== */
        .back-section {
            text-align: center;
            padding: 10px 20px 40px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 32px;
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 700;
            background: #FFF;
            border: 4px solid var(--border-color);
            border-radius: 999px;
            box-shadow: var(--neo-shadow);
            text-decoration: none;
            color: var(--text-dark);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .back-btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: var(--neo-shadow-hover);
        }

        .back-btn:active {
            transform: translate(2px, 2px);
            box-shadow: var(--neo-shadow-active);
        }

        /* ==========================================================================
           CONFETTI CANVAS
           ========================================================================== */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        /* ==========================================================================
           FLOATING EMOJIS
           ========================================================================== */
        .floating-emoji {
            position: absolute;
            pointer-events: none;
            font-size: 2.2rem;
            opacity: 0.2;
            animation: floatAround 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes floatAround {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-50px) rotate(15deg); }
        }

        /* ==========================================================================
           FOOTER
           ========================================================================== */
        footer {
            text-align: center;
            padding: 24px 16px;
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.4);
            border-top: 3px solid var(--border-color);
            margin-top: auto;
            z-index: 10;
        }

        /* ==========================================================================
           RESPONSIVE
           ========================================================================== */
        @media (max-width: 480px) {
            .top-bar {
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
                padding: 10px 12px;
            }
            .brand-pill {
                font-size: 1rem;
                padding: 4px 12px;
            }
            .lang-dropdown {
                font-size: 0.85rem;
                padding: 6px 32px 6px 12px;
            }
            .stories-container {
                grid-template-columns: 1fr;
                padding: 0 12px;
                gap: 20px;
            }
            .story-card {
                padding: 20px 16px;
            }
            .story-card .story-title {
                font-size: 1.2rem;
            }
            .page-header h1 {
                font-size: 2.2rem;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .stories-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Floating Background Emojis -->
    <span class="floating-emoji" style="top: 10%; left: 5%;">📚</span>

    <span class="floating-emoji" style="bottom: 25%; left: 8%; animation-delay: 5s;">🎭</span>
    <span class="floating-emoji" style="bottom: 15%; right: 6%; animation-delay: 2s;">🤪</span>

                <option value="ps">🇦🇫 پښتو / دری (Afghan)</option>
            </select>
        </div>
    </header>

    <!-- Page Header -->
    <section class="page-header">
        <span class="emoji-burst">📖</span>
        <h1 id="pageTitle">Funny Stories</h1>

    </section>

    <section class="stories-container" id="storiesContainer">
        <!-- Stories will be injected here by JavaScript -->

    <!-- Back Button -->
    <div class="back-section">
        <a href="#" class="back-btn clickable" onclick="goBack(); return false;">
            <span>⬅️</span> Back to Laugh Zone
        </a>
    </div>

    <!-- Footer -->
    <footer>
        <p>🎪 Made with pure joy for gigglers worldwide. Laugh everyday!</p>
    </footer>

    <script>
        /**

        const TRANSLATIONS = {

                stories: [
                    { emoji: "🦆", title: "The Duck Who Thought He Was a Dog",

                    { emoji: "🐱", title: "Cat vs. The Vacuum Cleaner",

                    { emoji: "🚽", title: "The Toilet Paper Incident", 
                      content: "I once ran out of toilet paper during a Zoom meeting. I had to waddle sideways to the closet, grab a new roll, and waddle back. My boss asked, 'What are you doing?' I said, 'Just getting some... documents.' I'll never live it down." },
                    { emoji: "🐶", title: "My Dog Thinks He's a Human", 
                      content: "My golden retriever, Buddy, sits at the dinner table with us. He uses a fork (poorly), watches TV (especially animal commercials), and even tries to read the newspaper (upside down). Yesterday, he tried to pay for groceries with a leaf. We're worried." },
                    { emoji: "🍌", title: "The Banana Phone Prank",

                    { emoji: "🦷", title: "The Dentist Who Made Me Laugh", 
                      content: "I went to the dentist with a toothache. He said, 'Don't worry, I'll have you laughing in no time.' I asked, 'How?' He replied, 'I'll tell you a joke while I drill!' He told me a pun so bad that I laughed, and my tooth fell out on its own. Genius." },
                    { emoji: "🚗", title: "The GPS Lady Is My Nemesis", 
                      content: "My GPS says 'In 500 feet, turn left.' I turn left immediately. She says, 'Recalculating.' I yell, 'You said turn left!' She replies, 'In 500 feet, turn left.' We have a toxic relationship. She's always right. Literally." },
                    { emoji: "🍔", title: "The Burger That Made Me Cry",

                    { emoji: "🐧", title: "The Penguin at the Mall",

                    { emoji: "🎈", title: "The Balloon That Wouldn't Pop",

                    { emoji: "🧦", title: "The Sock That Disappeared", 
                      content: "I put two socks in the washing machine. Only one came out. I searched everywhere. Three weeks later, I found it in the freezer. I have no explanation. The sock still looks at me funny. I think it knows something I don't." }
                ]
            },
            bn: {
                pageTitle: "মজার গল্প",
                pageSubtitle: "🤣 পেটে খিল ধরা গল্প যা শুনলে হাসি থামবে না!",

                    { emoji: "🍕", title: "যে পিৎজা আমার জীবন বদলে দিয়েছিল",

                    { emoji: "🚽", title: "টয়লেট পেপার কাণ্ড",

        /**
         * SOUND & CONFETTI
         */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            }
            playBoing() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sine';
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
            playCheer() {
                this.init();
                if (!this.ctx) return;
                [440, 554.37, 659.25, 880].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'triangle';
                    const now = this.ctx.currentTime + (i * 0.08);
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                });
            }
        }

        class ConfettiEngine {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.animationId = null;
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            burst(x = window.innerWidth / 2, y = window.innerHeight / 2) {
                const colors = ['#FFD200', '#FF3366', '#00E676', '#00C2FF', '#8A2387', '#FF5E36'];
                for (let i = 0; i < 40; i++) {
                    this.particles.push({
                        x: x + (Math.random() - 0.5) * 40,
                        y: y + (Math.random() - 0.5) * 40,
                        size: Math.random() * 8 + 6,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        vx: (Math.random() - 0.5) * 16,
                        vy: (Math.random() - 0.7) * 16,
                        gravity: 0.45,
                        rotation: Math.random() * 360,
                        rotSpeed: (Math.random() - 0.5) * 12,
                        life: 1
                    });
                }
                if (!this.animationId) this.animate();
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.rotation += p.rotSpeed;
                    p.life -= 0.015;
                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }
                    this.ctx.save();
                    this.ctx.translate(p.x, p.y);
                    this.ctx.rotate((p.rotation * Math.PI) / 180);
                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.life;
                    this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    this.ctx.restore();
                }
                if (this.particles.length > 0) {
                    this.animationId = requestAnimationFrame(() => this.animate());
                } else {
                    this.animationId = null;
                }
            }
        }

        /**
         * MAIN APP
         */
        const LaughZoneApp = (() => {
            let currentLang = 'en';
            let soundFx, confetti;

            function init() {
                soundFx = new SoundFX();
                confetti = new ConfettiEngine('confetti-canvas');

                const langDropdown = document.getElementById('languageSelect');
                langDropdown.addEventListener('change', (e) => {
                    setLanguage(e.target.value);
                });

                // Check URL hash for language
                const hash = window.location.hash;
                if (hash) {
                    const langMap = { '#en': 'en', '#bn': 'bn', '#es': 'es', '#pt': 'pt', '#ps': 'ps' };
                    if (langMap[hash]) {
                        langDropdown.value = langMap[hash];
                        setLanguage(langMap[hash]);
                    }
                }

                renderStories('en');
            }

            function setLanguage(langCode) {
                if (!TRANSLATIONS[langCode]) return;
                currentLang = langCode;

                if (langCode === 'ps') {
                    document.documentElement.setAttribute('dir', 'rtl');
                } else {
                    document.documentElement.setAttribute('dir', 'ltr');
                }

                renderStories(langCode);
                soundFx.playBoing();
                confetti.burst(window.innerWidth - 100, 60);
            }

            function renderStories(langCode) {
                const data = TRANSLATIONS[langCode];
                if (!data) return;

                document.getElementById('pageTitle').textContent = data.pageTitle;
                document.getElementById('pageSubtitle').textContent = data.pageSubtitle;

                const container = document.getElementById('storiesContainer');
                container.innerHTML = '';

                data.stories.forEach((story, index) => {
                    const card = document.createElement('div');
                    card.className = 'story-card clickable';
                    card.innerHTML = `
                        <span class="story-number">#${index + 1}</span>
                        <div class="story-emoji">${story.emoji}</div>
                        <h3 class="story-title">${story.title}</h3>
                        <p class="story-content">${story.content}</p>
                        <span class="story-tag">😂 ${['Silly', 'Wacky', 'Epic', 'Classic', 'Crazy', 'Funny'][index % 6]}</span>
                    `;
                    card.addEventListener('click', () => {
                        soundFx.playBoing();
                        confetti.burst(
                            window.innerWidth / 2 + (Math.random() - 0.5) * 100,
                            window.innerHeight / 2 + (Math.random() - 0.5) * 100
                        );
                    });
                    container.appendChild(card);
                });
            }

            function triggerCheer() {
                soundFx.playCheer();
                confetti.burst(100, 100);
                confetti.burst(window.innerWidth - 100, 100);
                confetti.burst(window.innerWidth / 2, 60);
            }

            function goBack() {
                soundFx.playBoing();
                confetti.burst(window.innerWidth / 2, window.innerHeight / 2);
                // Navigate back to main page
                window.location.href = 'index.html';
            }

            return { init, setLanguage, triggerCheer, goBack };
        })();

        // Make functions globally accessible for inline onclick
        function triggerCheer() { LaughZoneApp.triggerCheer(); }
        function goBack() { LaughZoneApp.goBack(); }

        document.addEventListener('DOMContentLoaded', LaughZoneApp.init);
    </script>
